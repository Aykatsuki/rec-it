[project]
name = "recit-media-ai"
version = "0.0.1"
description = "Rec-It media AI sidecar: transcription, scene detection and tracking (JSON-RPC over stdio)"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Installed on demand from the app (one-time, large download): local Whisper transcription.
transcribe = [
  "faster-whisper>=1.1",
  # CUDA 12 libraries for CTranslate2 on NVIDIA GPUs (Windows; Linux uses the system CUDA).
  "nvidia-cublas-cu12>=12.4; sys_platform == 'win32'",
  "nvidia-cudnn-cu12>=9.1,<10; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recit_media_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["whisper: runs the real Whisper model (needs the transcribe extra and model download)"]
addopts = "-m 'not whisper'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
