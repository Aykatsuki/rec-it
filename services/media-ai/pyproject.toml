[project]
name = "recit-media-ai"
version = "0.0.1"
description = "Rec-It media AI sidecar: transcription, scene detection and tracking (JSON-RPC over stdio)"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recit_media_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
