name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit and Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - name: Download FFmpeg (GPL build, used by media integration tests)
        run: pnpm fetch-ffmpeg
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Python sidecar tests
        working-directory: services/media-ai
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q
      # The "Install transcription" button runs `uv sync --extra transcribe` on Windows; make sure
      # every locked package has a Windows wheel (NVIDIA sometimes publishes Linux-only releases).
      - name: Optional extras (transcription, face detection) resolve for Windows
        working-directory: services/media-ai
        run: |
          uv export --quiet --extra transcribe --extra reframe --no-hashes --no-emit-project > /tmp/req.txt
          uv pip install --dry-run --python-platform x86_64-pc-windows-msvc --python-version 3.12 \
            --target /tmp/wincheck -r /tmp/req.txt

  whisper:
    name: Real models (Whisper tiny on CPU, YuNet face detection)
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Speech synthesiser and FFmpeg for the test clip
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
      - name: faster-whisper end to end
        working-directory: services/media-ai
        run: |
          uv sync --extra transcribe --extra reframe
          uv run pytest -q -o addopts=""

  desktop:
    name: Build and end-to-end (${{ matrix.os }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # macOS is not a release target yet (ADR-017); keep it informative only.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - name: Download FFmpeg (GPL build)
        if: runner.os != 'macOS'
        run: pnpm fetch-ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Unit and integration tests on this platform
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: End-to-end tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @rec-it/desktop exec playwright test
      - name: End-to-end tests
        if: runner.os != 'Linux'
        run: pnpm --filter @rec-it/desktop exec playwright test
      # React development mode (as in `pnpm dev`) mounts effects twice; the GPU preview must
      # survive that (ADR-029; the caption layer too, ADR-032). Windows is the target platform.
      - name: GPU preview in React development mode
        if: runner.os == 'Windows'
        shell: bash
        run: |
          RECIT_REACT_DEV=1 pnpm --filter @rec-it/desktop exec electron-vite build
          pnpm --filter @rec-it/desktop exec playwright test e2e/frames.spec.ts e2e/captions.spec.ts e2e/reframe.spec.ts
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}
          path: apps/desktop/test-results
          retention-days: 7
