name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: system
    attributes:
      label: System
      description: Windows version, GPU and driver (Settings → System shows these)
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
